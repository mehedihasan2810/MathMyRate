name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Compile-only fixture. Never deploy artifacts from this job.
      # Alchemy supplies the real public API origin when deploying.
      PUBLIC_SERVER_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - name: Check generated output and source cleanliness
        run: |
          test -s apps/web/dist/index.html
          test -s apps/web/dist/login/index.html
          test -s apps/web/dist/signup/index.html
          test -s apps/web/dist/dashboard/index.html
          git diff --exit-code
